<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - DriveEasy</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">


<div class="auth-box">

    <a href="index.html"
       class="logo">
        Drive<span>Easy</span>
    </a>


    <h1>
        Welcome Back
    </h1>

    <p>
        Login to manage your car rentals.
    </p>


    <form onsubmit="loginUser(event)">

        <label>
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            required
            placeholder="you@example.com"
        >


        <label>
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            required
            placeholder="Enter password"
        >


        <button
            class="btn full"
            type="submit">
            Login
        </button>

    </form>


    <p
        class="auth-message"
        id="loginMessage">
    </p>


    <p>
        Don't have an account?

        <a href="register.html">
            Create one
        </a>
    </p>


    <a href="index.html"
       class="back-link">
        ← Back to website
    </a>

</div>


<script src="js/script.js"></script>

</body>
</html>
